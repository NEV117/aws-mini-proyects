AWSTemplateFormatVersion: '2010-09-09'

Parameters:
  Service:
    Type: String
    Default: 'sms-notification-service'
    Description: 'Value of the Service tag'
  Environment:
    Type: String
    Default: 'dev'
    Description: 'Value of the Environment tag'
  Owner:
    Type: String
    Default: 'cloud-platform-team'
    Description: 'Value of the Owner tag'
  Project:
    Type: String
    Default: 'aws-mini-projects'
    Description: 'Value of the Project tag'

Resources:
  LambdaExecutionRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service: 'lambda.amazonaws.com'
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: 'LambdaExecutionPolicy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                  - 'sns:Publish'
                Resource: '*'
      Tags:
        - Key: 'Service'
          Value: !Ref Service
        - Key: 'Environment'
          Value: !Ref Environment
        - Key: 'Owner'
          Value: !Ref Owner
        - Key: 'Project'
          Value: !Ref Project

  LambdaFunction:
    Type: 'AWS::Lambda::Function'
    Properties:
      Handler: 'index.handler'
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: 'your-s3-bucket'
        S3Key: 'function.zip'
      Runtime: 'nodejs22.x'
      Timeout: 30
      Tags:
        - Key: 'Service'
          Value: !Ref Service
        - Key: 'Environment'
          Value: !Ref Environment
        - Key: 'Owner'
          Value: !Ref Owner
        - Key: 'Project'
          Value: !Ref Project

  ApiGatewayRestApi:
    Type: 'AWS::ApiGateway::RestApi'
    Properties:
      Name: 'SMSLambdaApi'
      Tags:
        - Key: 'Service'
          Value: !Ref Service
        - Key: 'Environment'
          Value: !Ref Environment
        - Key: 'Owner'
          Value: !Ref Owner
        - Key: 'Project'
          Value: !Ref Project

  ApiGatewayResource:
    Type: 'AWS::ApiGateway::Resource'
    Properties:
      ParentId: !GetAtt ApiGatewayRestApi.RootResourceId
      PathPart: 'send-sms'
      RestApiId: !Ref ApiGatewayRestApi

  ApiGatewayMethod:
    Type: 'AWS::ApiGateway::Method'
    Properties:
      AuthorizationType: 'NONE'
      HttpMethod: 'POST'
      ResourceId: !Ref ApiGatewayResource
      RestApiId: !Ref ApiGatewayRestApi
      Integration:
        IntegrationHttpMethod: 'POST'
        Type: 'AWS_PROXY'
        Uri: !Sub
          - 'arn:aws:apigateway:${Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - Region: !Ref 'AWS::Region'
            LambdaArn: !GetAtt LambdaFunction.Arn

  ApiGatewayDeployment:
    Type: 'AWS::ApiGateway::Deployment'
    DependsOn: ApiGatewayMethod
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      StageName: 'stage'
      # The deployment itself can't be tagged; these tags go on the stage it creates.
      StageDescription:
        Tags:
          - Key: 'Service'
            Value: !Ref Service
          - Key: 'Environment'
            Value: !Ref Environment
          - Key: 'Owner'
            Value: !Ref Owner
          - Key: 'Project'
            Value: !Ref Project

  LambdaInvokePermission:
    Type: 'AWS::Lambda::Permission'
    Properties:
      Action: 'lambda:InvokeFunction'
      FunctionName: !Ref LambdaFunction
      Principal: 'apigateway.amazonaws.com'
      SourceArn: !Sub
        - 'arn:aws:execute-api:${Region}:${AccountId}:${ApiId}/*/POST/send-sms'
        - Region: !Ref 'AWS::Region'
          AccountId: !Ref 'AWS::AccountId'
          ApiId: !Ref ApiGatewayRestApi