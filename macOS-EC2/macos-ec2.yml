AWSTemplateFormatVersion: "2010-09-09"
Description: "EC2 macOS instance on a dedicated host, managed with SSM, with a remote desktop (Screen Sharing) user"

Parameters:
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: "AZ for the dedicated host. It must offer mac2.metal (see README)."

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: "VPC for the security group (e.g. the default VPC)"

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: "Subnet for the instance. It must be in the same AZ as AvailabilityZone."

  MacAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Description: "Public SSM parameter for the macOS AMI (arm64, required by mac2.metal)"
    Default: "/aws/service/ec2-macos/sequoia/arm64_mac/latest/image_id"

  AllowedVncCidr:
    Type: String
    Description: "Optional CIDR allowed to reach VNC on port 5900 (e.g. 203.0.113.10/32). Leave empty to open no port and connect through the SSM tunnel."
    Default: ""
    AllowedPattern: "^$|^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$"
    ConstraintDescription: "Must be empty or a CIDR such as 203.0.113.10/32."

  RemoteUsername:
    Type: String
    Description: "Username for remote desktop (Screen Sharing) access"
    Default: "remoteuser"
    AllowedPattern: "^[a-z_][a-z0-9_]{0,30}$"
    ConstraintDescription: "Lowercase letters, digits and underscores, starting with a letter or underscore."

  RemoteUserPassword:
    Type: String
    Description: "Password for the remote desktop user"
    NoEcho: true # Hides the password in the AWS console
    MinLength: 8
    MaxLength: 64
    AllowedPattern: "^[a-zA-Z0-9@#%^&*]+$"
    ConstraintDescription: "8-64 characters: letters, digits and @#%^&* only (no accents or spaces)."

Conditions:
  OpenVncPort: !Not [!Equals [!Ref AllowedVncCidr, ""]]

Resources:
  # Role that lets the SSM agent on the Mac register with Systems Manager
  MacInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  MacInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref MacInstanceRole

  # Dedicated host required for macOS instances (24 h minimum allocation)
  MacDedicatedHost:
    Type: AWS::EC2::Host
    Properties:
      AvailabilityZone: !Ref AvailabilityZone
      InstanceType: mac2.metal

  # No inbound rules unless AllowedVncCidr is set; SSM needs outbound only
  MacSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "macOS instance - VNC only when AllowedVncCidr is set"
      VpcId: !Ref VpcId
      SecurityGroupIngress: !If
        - OpenVncPort
        - - IpProtocol: tcp
            FromPort: 5900
            ToPort: 5900
            CidrIp: !Ref AllowedVncCidr
        - !Ref AWS::NoValue

  MacEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: mac2.metal
      ImageId: !Ref MacAmiId
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref MacSecurityGroup
      IamInstanceProfile: !Ref MacInstanceProfile
      Tenancy: host
      HostId: !Ref MacDedicatedHost
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-mac"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Runs once at first boot via ec2-macos-init.
          # Values are quoted so password symbols (#, &, *) are not interpreted by bash.
          REMOTE_USER='${RemoteUsername}'
          REMOTE_PASS='${RemoteUserPassword}'

          # Create the remote desktop user (admin)
          sudo sysadminctl -addUser "$REMOTE_USER" -fullName "Remote User" -password "$REMOTE_PASS" -admin

          # Enable Screen Sharing (VNC on port 5900), as documented by AWS for EC2 Mac
          sudo launchctl enable system/com.apple.screensharing
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist

Outputs:
  MacEC2InstanceId:
    Description: "EC2 macOS instance ID"
    Value: !Ref MacEC2Instance

  MacDedicatedHostId:
    Description: "Dedicated host ID (released when the stack is deleted, after the 24 h minimum)"
    Value: !Ref MacDedicatedHost

  MacEC2InstancePublicIP:
    Description: "Public IP (only set if the subnet auto-assigns public IPs, as default-VPC subnets do)"
    Value: !GetAtt MacEC2Instance.PublicIp

  ScreenSharingTunnelCommand:
    Description: "Run locally, then open vnc://localhost:5900"
    Value: !Sub "aws ssm start-session --region ${AWS::Region} --target ${MacEC2Instance} --document-name AWS-StartPortForwardingSession --parameters portNumber=5900,localPortNumber=5900"
